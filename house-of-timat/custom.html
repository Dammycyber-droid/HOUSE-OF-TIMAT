<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom order | HOUSE OF TIMAT</title><meta name="description" content="HOUSE OF TIMAT: luxury fashion and made-to-measure tailoring."><link rel="stylesheet" href="css/style.css"></head>
<body data-page="custom"><main>
<section class="wrap"><h1 class="h">Custom tailoring</h1><div class="cust"><form class="f" id="cf" data-send="Custom order request" novalidate>
<label class="l">Garment<select name="garment"><option>Dress</option><option>Top</option><option>Trousers</option><option>Native set</option><option>Suit</option><option>Other</option></select></label>
<div class="opt"><span>Size</span><label class="chip"><input type="radio" name="size" value="XS"><b>XS</b></label><label class="chip"><input type="radio" name="size" value="S"><b>S</b></label><label class="chip"><input type="radio" name="size" value="M" checked><b>M</b></label><label class="chip"><input type="radio" name="size" value="L"><b>L</b></label><label class="chip"><input type="radio" name="size" value="XL"><b>XL</b></label><label class="chip"><input type="radio" name="size" value="Custom measurements"><b>Custom</b></label></div>
<div class="opt"><span>Colour</span><label class="sw"><input type="radio" name="color" value="Wine" checked><i style="background:#5a1f2b" title="Wine"></i></label><label class="sw"><input type="radio" name="color" value="Ivory"><i style="background:#e6dccb" title="Ivory"></i></label><label class="sw"><input type="radio" name="color" value="Sand"><i style="background:#c2a27a" title="Sand"></i></label><label class="sw"><input type="radio" name="color" value="Noir"><i style="background:#221a17" title="Noir"></i></label><label class="sw"><input type="radio" name="color" value="Sage"><i style="background:#7d8a6b" title="Sage"></i></label><label class="sw"><input type="radio" name="color" value="Rose"><i style="background:#c98f8f" title="Rose"></i></label></div>
<label class="l">Fabric<select name="fabric"><option>Silk</option><option>Satin</option><option>Lace</option><option>Ankara</option><option>Linen</option><option>Crepe</option><option>Velvet</option></select></label>
<div class="g2"><label class="l">Bust (in)<input type="number" name="bust" min="10" max="80" step=".5"></label><label class="l">Waist (in)<input type="number" name="waist" min="10" max="80" step=".5"></label><label class="l">Hips (in)<input type="number" name="hips" min="10" max="80" step=".5"></label><label class="l">Shoulder (in)<input type="number" name="shoulder" min="5" max="40" step=".5"></label><label class="l">Length (in)<input type="number" name="length" min="10" max="80" step=".5"></label><label class="l">Sleeve (in)<input type="number" name="sleeve" min="0" max="40" step=".5"></label></div>
<label class="l">Special design instructions<textarea name="notes" rows="4" placeholder="Neckline, sleeves, occasion, event date, inspiration..."></textarea></label>
<label class="l">Name<input name="name" required autocomplete="name"></label><label class="l">Email<input type="email" name="email" required autocomplete="email"></label><label class="l">Phone number<input type="tel" name="phone" required autocomplete="tel"></label>
<button class="btn">Submit custom order</button></form>
<aside class="sumbox"><h2>Order summary</h2><ul id="sum"></ul><p class="note">We review every request and reply with a quote and timeline before work begins.</p><a class="btn ghost" id="cwa" href="#" target="_blank" rel="noopener">Send via WhatsApp instead</a></aside></div></section>
</main>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
